name = "onyx-edge-bridge"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://axim.us.com"
CORE_API_URL = "https://api.axim-core.internal"
SUPABASE_URL = "https://your-supabase-project.supabase.co"

# --- SECRETS DOCUMENTATION ---
# The following secrets MUST be securely bound via the environment vault:
# Use `wrangler secret put <SECRET_NAME>` to set these in production.
#
# - SUPABASE_SERVICE_ROLE_KEY
# - SUPABASE_ANON_KEY
# - AXIM_ONYX_SECRET
# - ANTHROPIC_API_KEY
# - DEEPSEEK_API_KEY
# - AXIM_SERVICE_KEY


# 10:00 AM UTC executes at 4:00 AM CST / 5:00 AM CDT (Guarantees delivery before 5 AM CST)
[triggers]
crons = ["0 0 * * *", "*/15 * * * *", "0 10 * * *", "0 17 * * 5"] # Daily digest, 15-minute SLA sweeps, and 10:00 AM UTC executes at 4:00 AM CST / 5:00 AM CDT

# --- KV NAMESPACE BINDINGS ---

[[kv_namespaces]]
binding = "KB_CACHE"
id = "64c11d5bc7f64a5dbc20673d9688b4f7"

[[kv_namespaces]]
binding = "IDEMPOTENCY_KV"
id = "ee8e5d5f13be45c9a91042cbd5e042df"

[[kv_namespaces]]
binding = "STATUS_KV"
id = "fake-status-kv-id-for-now"

# --- R2 BUCKET BINDINGS ---
[[r2_buckets]]
binding = "TELEMETRY_ARCHIVE"
bucket_name = "axim-telemetry-archive"

# R2 Lifecycle Retention Policy
# Retain backup objects for 365 days
lifecycle_retention_days = 365
